<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<title>مُدار · إدارة حملات المؤثرين</title>
<meta name="description" content="أدر حملات المؤثرين لعملائك من مكان واحد">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: #F8F8FB; direction: rtl; font-family: "IBM Plex Sans Arabic", "Helvetica Neue", Arial, sans-serif; color: #16151F; -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
  a { color: #16151F; text-decoration: none; }
  a:hover { color: #3B0CEB; }
  @keyframes fmFloat { 0%, 100% { transform: translateY(0) rotate(var(--tilt, 0deg)); } 50% { transform: translateY(-8px) rotate(var(--tilt, 0deg)); } }
  @keyframes fmDrift { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-24px); } }
  @keyframes fmIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
</style>
